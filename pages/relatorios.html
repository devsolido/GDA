<div class="page" id="page-relatorios">
    <div class="relatorio-section">
        <div class="relatorio-header">
            <h3><i class="fas fa-pen-alt"></i> Relatório Diário de Estudos</h3>
            <span class="badge">📝 Registre seu progresso</span>
        </div>
        <form class="relatorio-form" id="relatorioForm">
            <div>
                <label>📚 Disciplina</label>
                <select id="relatorioDisciplina" required><option value="">Selecione</option></select>
            </div>
            <div>
                <label>⏱️ Tempo (minutos)</label>
                <input type="number" id="relatorioTempo" placeholder="Ex: 120" min="1" required />
            </div>
            <div class="full-width">
                <label>📝 O que estudei hoje?</label>
                <textarea id="relatorioTexto" placeholder="Descreva o que você estudou..." required></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-salvar-relatorio"><i class="fas fa-save"></i> Salvar</button>
            </div>
        </form>
        <div class="relatorios-lista" id="relatoriosLista"></div>
    </div>
</div>
