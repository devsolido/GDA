<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDA - Gestão Digital Agregada</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0b0f15; color: #e8edf4; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 40px; background: #1a232e; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); max-width: 600px; }
    h1 { font-size: 48px; margin-bottom: 16px; color: #ffb300; }
    p { color: #7a8ea8; font-size: 18px; line-height: 1.6; }
    .status { display: inline-block; padding: 8px 24px; border-radius: 30px; background: rgba(76,175,80,0.15); color: #4caf50; margin-top: 20px; font-weight: 600; }
    .footer { margin-top: 30px; font-size: 12px; color: #7a8ea8; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 GDA</h1>
    <h2 style="color:#e8edf4;margin-bottom:8px;">Gestão Digital Agregada</h2>
    <p>Sistema de gestão acadêmica para o IFPA</p>
    <div class="status">✅ API Online</div>
    <p style="font-size:14px;margin-top:20px;">🚀 Servidor rodando perfeitamente!</p>
    <div class="footer">v7.3.0 · IFPA - Controle Ambiental</div>
  </div>
</body>
</html>
